{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{/* Read-only: get, list and watch Events only. No write verb appears here. */}}
{{- $namespaces := .Values.watchNamespaces | default (list .Release.Namespace) }}
{{- range $namespace := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-events-explorer.fullname" $ }}-reader
  namespace: {{ $namespace }}
  labels:
    {{- include "k8s-events-explorer.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
{{- end }}
