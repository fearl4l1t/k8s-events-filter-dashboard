apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-events-explorer.fullname" . }}
  labels:
    {{- include "k8s-events-explorer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "k8s-events-explorer.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
