version: 2.1

jobs:
  dashboard:
    docker:
      - image: cimg/node:24.22-browsers
    steps:
      - checkout
      - restore_cache:
          keys:
            - node24-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies and Chromium
          command: |
            npm ci
            npx playwright install chromium
      - save_cache:
          key: node24-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - ~/.cache/ms-playwright
      - run:
          name: Build
          command: npm run build
      - run:
          name: Validate synthetic fixtures
          command: npm run validate:fixtures
      - run:
          name: Unit tests
          command: circleci testsuite run "unit tests"
      - run:
          name: Check coverage thresholds
          command: npx tsx scripts/check-coverage.ts
      - store_test_results:
          path: test-results/circleci/unit
      - run:
          name: Browser acceptance tests
          command: circleci testsuite run "browser acceptance tests"
      - store_test_results:
          path: test-results/circleci/browser
      - run:
          name: Lint
          command: npm run lint

workflows:
  build-test-lint:
    jobs:
      - dashboard
