# Local Keycloak for the team-mode gate. The realm is imported on start; the
# users and roles exist only for the disposable test environment.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--http-port=8081", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8081"
    volumes:
      - ./deploy/keycloak/realm-events.json:/opt/keycloak/data/import/realm-events.json:ro
