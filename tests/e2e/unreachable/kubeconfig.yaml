#
# Test-only kubeconfig that points at a closed port. It holds no credential and
# is used to prove the unreachable-cluster state in the browser. TLS verification
# is never disabled.
apiVersion: v1
kind: Config
clusters:
  - name: unreachable
    cluster:
      server: https://127.0.0.1:9
users:
  - name: unreachable
    user:
      token: e2e-placeholder-not-a-secret
contexts:
  - name: unreachable
    context:
      cluster: unreachable
      user: unreachable
current-context: unreachable
